# GitLab CI - scaffold. Real jobs fill in as milestones land.
# - lint + unit tests enable as soon as metric and parser code exists (M1/M2).
# - smoke-eval regression gate enables in M1 once eval.run is implemented.

stages:
  - lint
  - test
  - eval

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - pip install -r requirements-dev.txt
    - pip install -e .

lint:
  stage: lint
  script:
    - ruff check src tests
    - mypy src

unit-tests:
  stage: test
  script:
    - pytest -q

smoke-eval:
  stage: eval
  script:
    - python -m eval.run --suite smoke --config configs/ci-smoke.yaml --out reports/runs
  artifacts:
    when: always
    paths:
      - reports/runs/
    expire_in: 30 days
