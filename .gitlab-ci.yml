# GitLab CI - scaffold. Real jobs fill in as milestones land.
# - lint + unit tests enable as soon as metric and parser code exists (M1/M2).
# - smoke-eval regression gate enables in M1 once eval.run is implemented.

stages:
  - lint
  - test
  - eval
  - maintenance

default:
  image: python:3.11-slim
  before_script:
    - python -V
    - pip install -r requirements-dev.txt
    - pip install -e .

.skip-issue-reminder-schedule:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ISSUE_REMINDERS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_STALE_ISSUE_COMMENTS == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_WEEKLY_TEAM_DIGEST == "true"'
      when: never
    - when: on_success

lint:
  extends: .skip-issue-reminder-schedule
  stage: lint
  script:
    - ruff check src tests
    - mypy src

unit-tests:
  extends: .skip-issue-reminder-schedule
  stage: test
  script:
    - pytest -q

smoke-eval:
  extends: .skip-issue-reminder-schedule
  stage: eval
  script:
    - python -m eval.run --suite smoke --config configs/ci-smoke.yaml --out reports/runs
  artifacts:
    when: always
    paths:
      - reports/runs/
    expire_in: 30 days

issue-reminders:
  stage: maintenance
  image: python:3.11-slim
  needs: []
  # Team-management automation only.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_ISSUE_REMINDERS == "true"'
    - when: never
  before_script:
    - python -V
    - pip install requests
  script:
    - python scripts/remind_issue_assignees.py

stale-issue-comments:
  stage: maintenance
  image: python:3.11-slim
  needs: []
  # Team-management automation only.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_STALE_ISSUE_COMMENTS == "true"'
    - when: never
  before_script:
    - python -V
    - pip install requests
  script:
    - python scripts/gitlab_team_automation.py stale-comments

weekly-team-digest:
  stage: maintenance
  image: python:3.11-slim
  needs: []
  # Team-management automation only.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_WEEKLY_TEAM_DIGEST == "true"'
    - when: never
  before_script:
    - python -V
    - pip install requests
  script:
    - python scripts/gitlab_team_automation.py weekly-digest
