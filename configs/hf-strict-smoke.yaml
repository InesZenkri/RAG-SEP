# Hugging Face smoke config for prompt-template validation.
name: hf_strict_smoke

ingest:
  parser: pymupdf
  strip_headers_footers: false
  extract_tables: false
  ocr: false

chunking:
  strategy: recursive
  chunk_size: 800
  chunk_overlap: 120

retrieval:
  mode: bm25
  top_k: 5
  store: memory

generation:
  provider: huggingface
  model: meta-llama/Meta-Llama-3-8B-Instruct
  temperature: 0.1
  max_tokens: 1024
  prompt_template: strict_citation
  citation_style: bracket
  quantization: null

abstention:
  enabled: true
  min_retrieval_score: 0.15
  min_citations: 1
  contradiction_check: false

cost:
  eur_per_1k_input: 0.0
  eur_per_1k_output: 0.0

evaluation:
  suite: smoke
  benchmark: sample
  metrics:
    - retrieval
    - answer
    - grounding
    - abstention
    - robustness
    - efficiency
  seed: 42
  output_dir: reports/hf-strict-smoke

cache_enabled: true
cache_dir: ./.llm_cache_hf_strict_smoke
