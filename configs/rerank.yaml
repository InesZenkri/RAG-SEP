# Hybrid + cross-encoder rerank (filled in at M4).
name: hybrid_rerank

ingest:
  parser: pymupdf
  strip_headers_footers: true
  extract_tables: true

chunking:
  chunk_size: 800
  chunk_overlap: 120

retrieval:
  mode: hybrid
  embedding_model: BAAI/bge-small-en-v1.5
  top_k: 5
  hybrid_alpha: 0.5
  rrf_k: 60
  rerank: true
  reranker_model: BAAI/bge-reranker-base
  rerank_top_n: 20

generation:
  provider: echo
  model: gemini-2.5-flash
  temperature: 0.1
  max_tokens: 2048
  prompt_template: strict_citation
  citation_style: bracket
  quantization: null

abstention:
  enabled: true
  min_retrieval_score: 0.15
  min_citations: 1
  contradiction_check: false

evaluation:
  suite: smoke
  benchmark: sample
  metrics:
    - retrieval
    - answer
    - grounding
    - abstention
    - robustness
    - efficiency
  seed: 42
  output_dir: reports/runs
  judge:
    enabled: false
    provider: gemini
    model: gemini-2.5-pro
    temperature: 0.0
    max_tokens: 512
    rubric:
      - factuality
      - groundedness
      - completeness
    calibration_set: datasets/sample/qa.jsonl

cache_enabled: true
cache_dir: ./.llm_cache
